name: Publish package

on:
  release:
    types: [published]
  # Pull requests run every step except the push, so packaging problems surface before a release.
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: Knock.net/Knock.net.csproj

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check version
        id: version
        env:
          IS_RELEASE: ${{ github.event_name == 'release' }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version=$(grep -oP '(?<=<PackageVersion>)[^<]+' "$PROJECT")
          sdk_version=$(grep -oP 'SdkVersion => "\K[^"]+' Knock.net/KnockClient.cs)
          echo "PackageVersion: $package_version, SdkVersion: $sdk_version"

          if [ "$package_version" != "$sdk_version" ]; then
            echo "::error::PackageVersion ($package_version) does not match KnockClient.SdkVersion ($sdk_version)"
            exit 1
          fi

          if [ "$IS_RELEASE" = "true" ] && [ "${TAG#v}" != "$package_version" ]; then
            echo "::error::Release tag $TAG does not match PackageVersion $package_version"
            exit 1
          fi

          # NuGet versions are immutable, so pushing an existing version always fails.
          if curl -sf https://api.nuget.org/v3-flatcontainer/knock.net/index.json \
            | jq -e --arg v "$package_version" '.versions | index($v)' > /dev/null; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Knock.net $package_version is already published on NuGet"
              exit 1
            fi
            echo "::warning::Knock.net $package_version is already published on NuGet; bump the version before releasing"
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      # GeneratePackageOnBuild packs the multi-target project before the net461 build exists (NU5026).
      - name: Pack
        run: >
          dotnet pack "$PROJECT"
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:GeneratePackageOnBuild=false
          --output artifacts

      - name: Check package contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          package="artifacts/Knock.net.$VERSION.nupkg"
          test -f "$package"
          test -f "artifacts/Knock.net.$VERSION.snupkg"
          contents=$(unzip -l "$package")
          for file in lib/netstandard2.0/Knock.net.dll lib/net461/Knock.net.dll; do
            if ! grep -q "$file" <<< "$contents"; then
              echo "::error::$package is missing $file"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/

  push:
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: the GitHub OIDC token is exchanged for a short-lived NuGet API key.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check NuGet user
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::The NUGET_USER secret (the nuget.org profile name that owns the trusted publishing policy) is not set"
            exit 1
          fi

      # The temporary API key is valid for one hour, so request it immediately before pushing.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
